stages:
  - build

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  BUILD_TYPE: Release

build:
  stage: build
  image: gcc:11
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq cmake make flex bison libreadline-dev
    - echo "=== Tool versions ==="
    - cmake --version
    - g++ --version
    - flex --version
    - bison --version
  script:
    - echo "=== Build ==="
    - mkdir -p build
    - cd build
    - cmake -DCMAKE_BUILD_TYPE=${BUILD_TYPE} ..
    - make -j$(nproc)
    - echo "=== Build artifacts ==="
    - ls -la bin/ || true
  artifacts:
    paths:
      - build/
    expire_in: 1 day
    when: always
  timeout: 30 minutes